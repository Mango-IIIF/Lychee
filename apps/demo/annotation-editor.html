<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Mango Annotation Editor Demo</title>
    <link rel="stylesheet" href="demo.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div class="hero__title">Mango Annotation Editor</div>
        <p class="hero__subtitle">
          Draw annotations directly on the canvas
        </p>
      </header>

      <section class="viewer-shell">
        <mango-annotation-editor
          manifest-id="https://iiif.io/api/cookbook/recipe/0005-image-service/manifest.json"
          config='{"annotations":{"languages":["en","cy"]}}'
        ></mango-annotation-editor>
      </section>
    </div>
    <script type="module" src="dist/mango-annotation-editor.js"></script>
    <script>
      const editor = document.querySelector('mango-annotation-editor');
      if (editor) {
        editor.addEventListener('exportAnnotationPage', (event) => {
          console.log('Exported AnnotationPage:', event.detail.page);
        });
      }
    </script>
  </body>
</html>
